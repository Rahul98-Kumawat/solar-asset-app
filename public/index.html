<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Asset Management</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.min.css" rel="stylesheet">
</head>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Solar Asset Management</a>
            <button class="btn btn-outline-light btn-sm ms-auto" onclick="openSettingsModal()">Settings</button>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3>Asset Inventory</h3>
            <button class="btn btn-primary" onclick="addModal.show()">+ Add Asset</button>
        </div>

        <div class="table-responsive bg-white shadow-sm rounded p-3">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Location</th>
                        <th>Block</th>
                        <th>Equipment</th>
                        <th>Sub-Equipment</th>
                        <th>Make</th>
                        <th>Qty</th>
                        <th>Capacity</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="assetTableBody">
                    <!-- Dynamic Rows Loaded Here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add Asset Modal -->
    <div class="modal fade" id="addModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Asset</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addForm">
                        <div class="mb-2"><input type="text" class="form-control" id="addLocation" placeholder="Location" required></div>
                        <div class="mb-2"><input type="text" class="form-control" id="addBlock" placeholder="Block" required></div>
                        <div class="mb-2"><input type="text" class="form-control" id="addEquipmentName" placeholder="Equipment Name" required></div>
                        <button type="submit" class="btn btn-primary w-100 mt-2">Save Asset</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal fade" id="settingsModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">System Settings</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Settings configured successfully.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Developer Credit Footer -->
    <footer class="text-center py-3 my-4 border-top text-muted">
        <p class="mb-0">Designed & Developed by <strong>Rahul Kumawat</strong></p>
    </footer>

    <!-- 1. Bootstrap JS (MUST BE LOADED FIRST) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>

    <!-- 2. Your Custom Script (LOADED SECOND) -->
    <script>
        let addModal, editModal, settingsModal;
        let rawData = [];

        document.addEventListener('DOMContentLoaded', () => {
            // Ensure Bootstrap bundle loaded correctly
            if (typeof bootstrap !== 'undefined') {
                addModal = new bootstrap.Modal(document.getElementById('addModal'));
                settingsModal = new bootstrap.Modal(document.getElementById('settingsModal'));
            }
            fetchAssets();
        });

        function openSettingsModal() {
            if (settingsModal) {
                settingsModal.show();
            } else {
                const el = document.getElementById('settingsModal');
                const modal = bootstrap.Modal.getOrCreateInstance(el);
                modal.show();
            }
        }

        async function fetchAssets() {
            try {
                const res = await fetch('/api/assets');
                if (res.ok) {
                    rawData = await res.json();
                    renderTable(rawData);
                }
            } catch (err) {
                console.error("Failed to load assets:", err);
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('assetTableBody');
            if (!tbody) return;
            tbody.innerHTML = '';
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="text-center text-muted">No asset records found</td></tr>';
                return;
            }
            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.id || '-'}</td>
                    <td>${item.location || '-'}</td>
                    <td>${item.block || '-'}</td>
                    <td>${item.equipmentName || '-'}</td>
                    <td>${item.subEquipmentName || '-'}</td>
                    <td>${item.make || '-'}</td>
                    <td>${item.qty || '-'}</td>
                    <td>${item.capacity || '-'}</td>
                    <td><button class="btn btn-sm btn-outline-danger">Delete</button></td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
